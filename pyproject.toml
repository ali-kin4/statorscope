[project]
name = "statorscope"
version = "0.3.0"
description = "Motor Current Signature Analysis that knows when to refuse. Detect broken rotor bars, stator faults and eccentricity from three-phase current - and get told when your data can't support the answer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ali Jabbary" }]
keywords = [
    "mcsa", "motor-current-signature-analysis", "condition-monitoring",
    "predictive-maintenance", "induction-motor", "fault-diagnosis",
    "broken-rotor-bar", "signal-processing", "vibration", "industrial-iot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.7"]
plot = ["matplotlib>=3.8"]
all = ["statorscope[cli,plot]"]

[project.urls]
Homepage = "https://github.com/ali-kin4/statorscope"
Repository = "https://github.com/ali-kin4/statorscope"
Issues = "https://github.com/ali-kin4/statorscope/issues"

[project.scripts]
statorscope = "statorscope.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
 "pytest-cov>=5.0",
 "ruff>=0.6",
 "mypy>=1.11",
 "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statorscope"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "NPY", "PTH", "ARG", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "N803", "N806"]  # sig-heavy science APIs; math-style names

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
disallow_untyped_decorators = false
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/statorscope"]
